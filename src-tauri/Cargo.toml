[package]
name = "cpk_qc"
version = "0.1.1"
description = "CPK & QC 统计分析软件"
authors = ["Antigravity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-store = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
reqwest = { version = "0.13", features = ["json"] }
base64 = "0.22"
dirs = "6.0"
cpk_core = { path = "../cpk_core" }
cpk_storage = { path = "../cpk_storage" }
sha2 = "0.10"
[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[package.metadata.tauri]
bundle = { icon = ["src-tauri/icons/32x32.png", "src-tauri/icons/128x128.png", "src-tauri/icons/128x128@2x.png", "src-tauri/icons/icon.icns", "src-tauri/icons/icon.ico"] }

[package.metadata.tauri-winres]
icon = "src-tauri/icons/icon.ico"
